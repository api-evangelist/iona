aid: iona
name: IONA
description: IONA (IONA Drones) is a UK-based autonomous drone delivery company building
  the full technology stack for logistics operators. Its tilt-rotor Sonnet aircraft
  performs VTOL from compact sites and carries up to 20 parcels up to 200 km per autonomous
  flight. IONA pairs the aircraft with an onboard autonomy operating system, GPS/LiDAR
  sensor-fusion precision landing, a SORA-aligned BVLOS compliance engine, an operations
  centre for real-time fleet monitoring and analytics, and a digital twin for simulation
  and predictive maintenance. The platform integrates with existing TMS/WMS logistics
  systems and targets healthcare, rural/remote, express e-commerce, industrial, and
  maritime delivery. Backed by Techstars.
